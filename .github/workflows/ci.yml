name: CI/CD Pipeline

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

jobs:
  # .NET DataIngestor Tests
  test-data-ingestor:
    name: Test DataIngestor (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./data-ingestor
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore DataIngestor.sln
    
    - name: Build
      run: dotnet build DataIngestor.sln --configuration Release --no-restore
    
    - name: Run tests
      run: dotnet test DataIngestor.sln --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: data-ingestor-test-results
        path: data-ingestor/DataIngestor.Tests/TestResults/*.trx

  # .NET GraphQLGateway Tests
  test-graphql-gateway:
    name: Test GraphQLGateway (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./GraphQLGateway
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore GraphQLGateway.sln
    
    - name: Build
      run: dotnet build GraphQLGateway.sln --configuration Release --no-restore
    
    - name: Run tests
      run: dotnet test GraphQLGateway.sln --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: graphql-gateway-test-results
        path: GraphQLGateway/GraphQLGateway.Tests/TestResults/*.trx

  # Rust Data Processor Tests
  test-data-processor:
    name: Test Data Processor (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./data-processor-service
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
    
    - name: Build
      run: cargo build --verbose
    
    - name: Run tests
      run: cargo test --verbose

  # Node.js Notification Service Tests
  test-notification-service:
    name: Test Notification Service (Node.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./notification-service
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: notification-service/package-lock.json
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run tests
      run: npm test -- --coverage --watchAll=false
    
    - name: Upload coverage
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: notification-service-coverage
        path: notification-service/coverage/

  # React Frontend Tests
  test-frontend:
    name: Test Frontend (React/TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./unstable-situation
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: unstable-situation/package-lock.json
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run tests
      run: npm test -- --coverage --watchAll=false
    
    - name: Upload coverage
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: frontend-coverage
        path: unstable-situation/coverage/

  # Summary job that depends on all test jobs
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test-data-ingestor, test-graphql-gateway, test-data-processor, test-notification-service, test-frontend]
    if: always()
    
    steps:
    - name: Check test results
      run: |
        if [ "${{ needs.test-data-ingestor.result }}" != "success" ] || \
           [ "${{ needs.test-graphql-gateway.result }}" != "success" ] || \
           [ "${{ needs.test-data-processor.result }}" != "success" ] || \
           [ "${{ needs.test-notification-service.result }}" != "success" ] || \
           [ "${{ needs.test-frontend.result }}" != "success" ]; then
          echo "❌ Some tests failed"
          exit 1
        else
          echo "✅ All tests passed"
        fi
