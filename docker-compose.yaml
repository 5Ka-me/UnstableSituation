services:
  # Unstable External API (already provided)
  weakapp:
    build:
      context: ./WeakApp
      dockerfile: Dockerfile
    container_name: weakapp-api
    ports:
      - "8081:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
    restart: unless-stopped
    networks:
      - microservices-network

  # RabbitMQ message queue (for Data Ingestor)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"  # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Database - PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: microservices_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d microservices_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Data Ingestor Service (.NET 8)
  data-ingestor:
    build:
      context: ./data-ingestor
      dockerfile: Dockerfile
    container_name: data-ingestor
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - Server__Host=0.0.0.0
      - Server__Port=8080
      - Api__BaseUrl=http://weakapp-api:8080
      - Api__Timeout=00:00:30
      - Api__RetryCount=3
      - RabbitMQ__Url=amqp://guest:guest@rabbitmq:5672/
      - RabbitMQ__ExchangeName=meter-data-exchange
      - RabbitMQ__QueueName=meter-data-queue
      - RabbitMQ__RoutingKey=meter.data
      - Logging__Level=Information
    depends_on:
      rabbitmq:
        condition: service_healthy
      weakapp:
        condition: service_started
    networks:
      - microservices-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Data Processor Service (Rust)
  data-processor:
    build:
      context: ./data-processor-service
      dockerfile: Dockerfile
    container_name: data-processor
    environment:
      - RUST_LOG=info
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/microservices_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/%2f
    volumes:
      - ./data-processor-service/config.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-network
    restart: unless-stopped

  # GraphQL API Gateway (.NET)
  graphql-gateway:
    build:
      context: ./GraphQLGateway
      dockerfile: GraphQLGateway/Dockerfile
    container_name: graphql-gateway
    ports:
      - "5284:8080"  # Map external port 5284 to internal port 8080
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=microservices_db;Username=postgres;Password=postgres
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/graphql"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # React Frontend
  frontend:
    build:
      context: ./unstable-situation
      dockerfile: Dockerfile
    container_name: iot-frontend
    ports:
      - "3000:80"
    depends_on:
      graphql-gateway:
        condition: service_started
    networks:
      - microservices-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Notification Service (Node.js)
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - RABBITMQ_EXCHANGE_NAME=meter-data-exchange
      - RABBITMQ_QUEUE_NAME=meter-data-queue
      - RABBITMQ_ROUTING_KEY=meter.data
      - SIGNALR_URL=http://graphql-gateway:8080/notificationsHub
    depends_on:
      rabbitmq:
        condition: service_healthy
      graphql-gateway:
        condition: service_started
    networks:
      - microservices-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => {r.on('data', () => {}); r.on('end', () => process.exit(r.statusCode === 200 ? 0 : 1))})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Database Management - Adminer
  adminer:
    image: adminer:4.8.1
    container_name: adminer
    ports:
      - "8083:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - microservices-network
    restart: unless-stopped

  # Monitoring - Prometheus
  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: prometheus
  #   ports:
  #     - "9090:9090"
  #   volumes:
  #     - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
  #   networks:
  #     - microservices-network

  # # Monitoring - Grafana
  # grafana:
  #   image: grafana/grafana:latest
  #   container_name: grafana
  #   ports:
  #     - "3004:3000"
  #   environment:
  #     - GF_SECURITY_ADMIN_PASSWORD=admin
  #   volumes:
  #     - grafana_data:/var/lib/grafana
  #   networks:
  #     - microservices-network

volumes:
  postgres_data:
  grafana_data:
  rabbitmq_data:

networks:
  microservices-network:
    driver: bridge
