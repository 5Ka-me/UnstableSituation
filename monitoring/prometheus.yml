global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'iot-microservices'
    environment: 'production'

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'data-ingestor'
    static_configs:
      - targets: ['data-ingestor:8080']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'data-processor'
    static_configs:
      - targets: ['data-processor:3002']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'graphql-gateway'
    static_configs:
      - targets: ['graphql-gateway:8080']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'notification-service'
    static_configs:
      - targets: ['notification-service:3001']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']
    metrics_path: '/metrics'
    scrape_interval: 30s
